version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyftr-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - lyftr-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lyftr-frontend
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lyftr-data:
